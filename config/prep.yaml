# Free interview-prep resources, used by `jobradar draft <id>` (prep.md). The AI only picks topic keys from this
# file, so every link here was checked by hand, not generated. Edit freely: add a resource, a topic, or keywords
# (matched as whole words in the job posting when there is no AI key). kind: video, article, course, practice,
# docs, book, roadmap or cheatsheet; lang: en or hi (Hindi).

# Interview-prep resource catalog. URLs checked 2026-11-23 (HTTP status + page title; YouTube via oEmbed).
# Keywords assume word-boundary matching. Bare "go", "js", "ts", "ai", "ml", "os", "api" are left out because
# they match too much ("html" contains "ml", "rapid" contains "api"). "java" will also match inside "javascript"
# unless you match on word boundaries.
# Lines tagged "search-verified" are on sites that block automated fetches (Cloudflare/bot challenge). They were
# confirmed through the search index or by status only.
topics:
  dsa_roadmaps:
    title: DSA roadmaps & problem lists
    keywords: [dsa, data structures, algorithms, leetcode, coding interview, problem solving, coding round, competitive programming, time complexity, big o, neetcode]
    resources:
      - {title: "NeetCode Roadmap (NeetCode 150 by pattern)", url: "https://neetcode.io/roadmap", kind: roadmap, lang: en, note: "free; video solution for every problem"}  # search-verified (SPA)
      - {title: "NeetCode 150 problem list", url: "https://neetcode.io/practice/practice/neetcode150", kind: practice, lang: en, note: "free list; optional paid Pro tier"}  # search-verified (SPA)
      - {title: "Grind 75 (Tech Interview Handbook)", url: "https://www.techinterviewhandbook.org/grind75/", kind: practice, lang: en, note: "free, no signup; customisable weekly schedule"}
      - {title: "Striver's A2Z DSA Sheet", url: "https://takeuforward.org/prep-hub/strivers-a2z-dsa-sheet", kind: practice, lang: en, note: "free list; signup to track; paid Plus optional"}
      - {title: "Striver's SDE Sheet", url: "https://takeuforward.org/prep-hub/strivers-sde-sheet", kind: practice, lang: en, note: "free; must-do interview problems grouped by topic"}
      - {title: "LeetCode Top Interview 150 study plan", url: "https://leetcode.com/studyplan/top-interview-150/", kind: practice, lang: en, note: "free with signup to submit"}  # search-verified (Cloudflare 403)
