# Where jobradar looks. Only public job-board endpoints the companies publish for exactly this purpose
# (Greenhouse / Lever / Ashby / SmartRecruiters / Workable job-board APIs), plus career-site search
# endpoints whose robots.txt allows it (Workday, Amazon, Eightfold) - robots.txt is checked on every run.
#
# Every board below was verified live on 2026-11-16 to have open roles in India. Elsewhere, use `jobradar probe`
# to find the boards of companies hiring where you are.
# Add a company:  `uv run jobradar probe <company-slug> ...`  then paste the line it prints.

