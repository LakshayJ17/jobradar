                    machine-learning-engineer, data-scientist]}                  # startups (scraped)
remote: [himalayas, remoteok, jobicy]   # remote boards; only roles open to you (locations.remote_open_to) survive

# Generic scraper: any site whose job pages carry schema.org JobPosting data (most do - Google for Jobs needs it).
# robots.txt and the no-fetch list in http.py are enforced on every request.
# kind: jobs = skipped when profile.yaml wants internships only; kind: internships = read only when it wants them.
scrape:
  - name: Internshala
    kind: jobs
    list_urls:
      - https://internshala.com/fresher-jobs/software-development-jobs/
      - https://internshala.com/fresher-jobs/web-development-jobs/
      - https://internshala.com/fresher-jobs/data-science-jobs/
      - https://internshala.com/fresher-jobs/machine-learning-jobs/
      - https://internshala.com/fresher-jobs/artificial-intelligence-ai-jobs/
      - https://internshala.com/fresher-jobs/python-django-jobs/
    link_pattern: '^/job/detail/'
    title_from_url: '/job/detail/(?:fresher-)?(.+?)-job-'
    salary_label: 'CTC \(ANNUAL\)'      # pay shown on the page (its JSON-LD says 0)
    max_details: 60
    page_fallback:                     # its multi-location jobs carry no JobPosting data: read the page itself
      title: ['class="heading_4_5 profile">', '</div>']
      company: ['class="heading_6 company_name">', '</div>']
      location: ['id="location_names">', '</p>']
      description: ['class="internship_details">', 'about_company_text_container']
      posted: ['ic-16-reschedule"></i>', '</div>']
  - name: Internshala
    board: internshala-internships
    kind: internships
    list_urls:
      - https://internshala.com/internships/software-development-internship/
      - https://internshala.com/internships/web-development-internship/
      - https://internshala.com/internships/backend-development-internship/
      - https://internshala.com/internships/full-stack-development-internship/
      - https://internshala.com/internships/front-end-development-internship/
      - https://internshala.com/internships/data-science-internship/
      - https://internshala.com/internships/machine-learning-internship/
      - https://internshala.com/internships/artificial-intelligence-ai-internship/
      - https://internshala.com/internships/python-django-internship/
    link_pattern: '^/internship/detail/'
    title_from_url: '/internship/detail/(?:work-from-home-)?(.+?-internship)'   # keeps "part-time" for the title filter
    salary_label: 'Stipend'
    max_details: 60
    page_fallback:
      title: ['class="heading_4_5 profile">', '</div>']
      company: ['class="heading_6 company_name">', '</div>']
      location: ['id="location_names">', '</p>']
      description: ['class="internship_details">', 'about_company_text_container']
      posted: ['ic-16-reschedule"></i>', '</div>']
  - name: Shine
    kind: jobs
    list_urls:
      - https://www.shine.com/job-search/software-engineer-fresher-jobs
      - https://www.shine.com/job-search/fresher-software-developer-jobs
      - https://www.shine.com/job-search/python-developer-fresher-jobs
      - https://www.shine.com/job-search/machine-learning-fresher-jobs
    link_pattern: '^/jobs/[^/]+/[^/]+/\d+'
    title_from_url: '^/jobs/([^/]+)/'
    salary_label: 'salary_text\\?"\s*:\s*\\?"'   # page data; "[Salary Hidden]" (employer's choice) stays unknown
    max_details: 40
  # Freshteam career sites (its JSON feed is disallowed by robots.txt; the /jobs pages are allowed)
  - {name: Ninjacart, board: ninjacart, list_urls: ['https://ninjacart.freshteam.com/jobs'], link_pattern: '^/jobs/[^/]+/[^/]+',
     title_from_url: '^/jobs/[^/]+/(.+)$', company_from_page: false, max_details: 25}
  - {name: Haptik, board: haptik, list_urls: ['https://haptik.freshteam.com/jobs'], link_pattern: '^/jobs/[^/]+/[^/]+',
     title_from_url: '^/jobs/[^/]+/(.+)$', company_from_page: false, max_details: 25}
  - {name: Keka, board: keka, list_urls: ['https://keka.freshteam.com/jobs'], link_pattern: '^/jobs/[^/]+/[^/]+',
     title_from_url: '^/jobs/[^/]+/(.+)$', company_from_page: false, max_details: 25}
  - {name: Zetwerk, board: zetwerk, list_urls: ['https://zetwerk.freshteam.com/jobs'], link_pattern: '^/jobs/[^/]+/[^/]+',
     title_from_url: '^/jobs/[^/]+/(.+)$', company_from_page: false, max_details: 25}

