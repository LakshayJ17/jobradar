name: tests

on:
  push:
    paths-ignore: ["data/**", "**.md"]
  pull_request:
    paths-ignore: ["data/**", "**.md"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --frozen --group dev
      - name: Tests (offline)
        run: uv run --frozen pytest -q
      - name: CLI smoke test (no network, no keys)
        run: |
          uv run --frozen jobradar init
          uv run --frozen jobradar doctor
          uv run --frozen jobradar list
